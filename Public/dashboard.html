<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub Reserve - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>SportClub Reserve</h1>
        <div>
            <span id="userInfo">Cargando usuario...</span>
            <button id="logoutBtn" style="width: auto; margin-left: 10px; background-color: #c1121f;">Cerrar Sesión</button>
        </div>
    </header>

    <div class="container">
        <!-- Widget del Clima y Asistente IA -->
        <div style="display: flex; gap: 20px; flex-wrap: wrap;">
            <div class="card" style="flex: 1; min-width: 280px;">
                <h3>🌤️ Clima en el Club</h3>
                <div id="climaInfo">Cargando información del clima...</div>
            </div>

            <div class="card" style="flex: 2; min-width: 300px;">
                <h3>🤖 Asistente de IA (Conserje del Club)</h3>
                <form id="iaForm" style="display: flex; gap: 10px;">
                    <input type="text" id="iaPrompt" placeholder="Ej: ¿Qué horario me recomiendas para jugar tenis hoy?" required>
                    <button type="submit" style="width: 130px;">Preguntar</button>
                </form>
                <div id="iaRespuesta" style="margin-top: 10px; font-style: italic; color: #2d6a4f;"></div>
            </div>
        </div>

        <!-- Formulario para Hacer Reserva -->
        <div class="card">
            <h2>📅 Hacer una Reserva</h2>
            <form id="reservaForm">
                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 200px;">
                        <label>Instalación:</label>
                        <select id="instalacionSelect" required>
                            <option value="">Cargando instalaciones...</option>
                        </select>
                    </div>
                    <div style="flex: 1; min-width: 150px;">
                        <label>Fecha:</label>
                        <input type="date" id="fechaReserva" required>
                    </div>
                    <div style="flex: 1; min-width: 120px;">
                        <label>Hora Inicio:</label>
                        <input type="time" id="horaInicio" required>
                    </div>
                    <div style="flex: 1; min-width: 120px;">
                        <label>Hora Fin:</label>
                        <input type="time" id="horaFin" required>
                    </div>
                    <div style="flex: 1; min-width: 120px;">
                        <label>Personas / Comensales:</label>
                        <input type="number" id="personas" min="1" value="1" required>
                    </div>
                </div>
                <label style="margin-top: 10px; display: block;">Notas adicionales:</label>
                <input type="text" id="notasReserva" placeholder="Ej: Requiere raquetas adicionales o mesa de restaurante cerca del jardín">
                
                <button type="submit" style="margin-top: 15px;">Confirmar Reserva</button>
            </form>
        </div>

        <!-- Mis Reservas Realizadas -->
        <div class="card">
            <h2>📌 Mis Reservas</h2>
            <div id="misReservasLista">
                <p>Cargando tus reservas...</p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
